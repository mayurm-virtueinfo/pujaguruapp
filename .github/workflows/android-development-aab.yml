name: Android Development Release AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release Version Name (e.g. 1.0.8)"
        required: true
        type: string
        default: "1.0.8"
      version_code:
        description: "Release Version Code (Integer > 0, e.g. 17)"
        required: true
        type: string
        default: "17"

concurrency:
  group: android-dev-aab-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-development-aab:
    name: Build Development AAB (Artifact Only)
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Version Inputs
        shell: bash
        run: |
          set -e
          VERSION_NAME="${{ inputs.version_name }}"
          VERSION_CODE="${{ inputs.version_code }}"

          echo "Validating version inputs..."
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::version_name cannot be empty"
            exit 1
          fi

          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version_code must be a positive integer greater than 0 (received: $VERSION_CODE)"
            exit 1
          fi

          echo "Version Validation Passed: versionName=$VERSION_NAME, versionCode=$VERSION_CODE"

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Setup Java (17)
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17
          cache: "gradle"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT" >&2
            exit 1
          fi
          NDK_DIR="$SDK_ROOT/ndk/27.1.12297006"
          # Remove incomplete installations and cached archives.
          rm -rf "$NDK_DIR"
          rm -rf "$HOME/.android/cache"
          rm -rf "$SDK_ROOT/.temp"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Installing Android SDK components, attempt $attempt..."
            set +o pipefail
            yes | "$SDKMANAGER" --install \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;36.0.0" \
              "ndk;27.1.12297006"
            sdkmanager_status=$?
            set -o pipefail
            if [ "$sdkmanager_status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to install Android SDK components" >&2
              exit "$sdkmanager_status"
            fi
            rm -rf "$NDK_DIR" "$HOME/.android/cache" "$SDK_ROOT/.temp"
            sleep 10
          done
          test -f "$NDK_DIR/source.properties"

      - name: Setup Ruby (3.3)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Node Dependencies
        run: yarn install --frozen-lockfile

      - name: Reconstruct Development Environment (.env.development)
        shell: bash
        env:
          ENV_DEVELOPMENT: ${{ secrets.ENV_DEVELOPMENT }}
        run: |
          if [ -n "$ENV_DEVELOPMENT" ]; then
            echo "$ENV_DEVELOPMENT" > .env.development
            echo "Reconstructed .env.development from secret."
          elif [ -f ".env.development" ]; then
            echo "Using existing .env.development."
          elif [ -f ".env.example" ]; then
            echo "Generating fallback .env.development from .env.example..."
            cp .env.example .env.development
          fi

      - name: Setup Android Keystore & Signing Properties
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/pujaguru.keystore
            echo "Restored android/app/pujaguru.keystore from secret."
          fi

          cat <<EOF > android/keystore.properties
          RELEASE_STORE_FILE=app/pujaguru.keystore
          RELEASE_STORE_PASSWORD=${KEYSTORE_PASSWORD:-android}
          RELEASE_KEY_ALIAS=${KEY_ALIAS:-androiddebugkey}
          RELEASE_KEY_PASSWORD=${KEY_PASSWORD:-android}
          storeFile=app/pujaguru.keystore
          storePassword=${KEYSTORE_PASSWORD:-android}
          keyAlias=${KEY_ALIAS:-androiddebugkey}
          keyPassword=${KEY_PASSWORD:-android}
          EOF

      - name: Build AAB via Fastlane (NO Play Console Upload)
        run: |
          bundle exec fastlane android development_aab \
            version_name:"${{ inputs.version_name }}" \
            version_code:"${{ inputs.version_code }}"

      - name: Upload AAB as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-development-${{ inputs.version_name }}-${{ inputs.version_code }}-aab
          path: build/outputs/bundle/*.aab
          retention-days: 14
          if-no-files-found: error

      - name: Clean Up Sensitive Signing & Environment Credentials
        if: always()
        shell: bash
        run: |
          rm -f android/keystore.properties
          rm -f android/app/pujaguru.keystore
          echo "Cleaned up temporary sensitive credential files."
